[package]
name = "simple_mkv_player"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Windows video player and multi-track audio mixer for MKV and OBS recordings."

[dependencies]
cpal = "0.16"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
libloading = "0.9.0"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
